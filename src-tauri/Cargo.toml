[package]
name = "linglong-store"
version = "2.1.2"
description = "玲珑应用商店社区版"
authors = ["Shirosu<xfreell@163.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linglong_store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
tauri = { version = "=2.0.0", features = ["devtools"] }
tauri-macros = "=2.0.0"
tauri-codegen = "=2.0.0"
tauri-plugin-opener = "=2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
systemstat = "0.2"
once_cell = "1.19"
tauri-plugin-zustand = "=0.1.0"
tauri-plugin-os = "=2.0.0"
tauri-plugin-fs = "=2.0.0"
portable-pty = "=0.7.0"
tauri-plugin-log = "=2.0.0"
log = "0.4"
tauri-plugin-single-instance = "=2.0.0"
libc = "0.2.178"
# 龙芯 Rust 1.81 不支持 edition 2024，锁定使用兼容版本
dlopen2 = "=0.8.0"
dlopen2_derive = "=0.4.1"
zvariant = "=4.0.0"
zvariant_utils = "=1.1.0"
zbus = "=4.0.0"
time = "=0.3.36"
time-macros = "=0.2.18"
getrandom = "=0.3.3"
# 锁定到使用 getrandom 0.3 的版本，避免拉取 getrandom 0.4 (需要 edition 2024)
tempfile = "=3.14.0"
uuid = "=1.11.0"
