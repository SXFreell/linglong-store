[package]
name = "linglong-store"
version = "2.0.0-beta.1"
description = "玲珑应用商店"
authors = ["Shirosu<xfreell@163.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[app]
title = "玲珑应用商店"
identifier = "com.dongpl.linglong-store.v2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linglong_store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["system-tray", "devtools", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
systemstat = "0.2"
once_cell = "1.19"
tauri-plugin-store = { git = "https://github.com/tauri-apps/tauri-plugin-store", branch = "v1" }
portable-pty = "0.8"

